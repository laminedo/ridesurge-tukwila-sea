<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05080c" />
    <title>RideSurge is offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #05080c;
        color: #f2f5f9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 24px;
        border: 1px solid #1c2736;
        border-radius: 20px;
        background: #0c121b;
        text-align: center;
      }
      svg { width: 56px; height: 56px; }
      h1 { margin: 16px 0 8px; font-size: 20px; line-height: 1.2; }
      p { margin: 0; font-size: 14px; line-height: 1.5; color: #b4c0cf; }
      button {
        width: 100%;
        height: 52px;
        margin-top: 20px;
        border: 0;
        border-radius: 14px;
        background: #35d6c0;
        color: #03211d;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#131c29" />
        <circle cx="16" cy="16" r="10" fill="none" stroke="#35d6c0" stroke-opacity=".35" stroke-width="1.2" />
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="#35d6c0" stroke-opacity=".6" stroke-width="1.2" />
        <path d="M16 16 24.66 11" stroke="#35d6c0" stroke-width="1.6" stroke-linecap="round" />
        <circle cx="21" cy="9.5" r="2.4" fill="#f9c22e" />
      </svg>
      <h1>No connection yet</h1>
      <p>
        RideSurge needs to load once while you are online. After that it opens offline with the last saved forecast.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
